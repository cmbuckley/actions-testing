name: Workflow Run
on:
  workflow_run:
    workflows: PR Open
    types: completed

jobs:
  dump:
    name: Dump data
    runs-on: ubuntu-latest
    steps:
      - run: jq . <<< "${{ toJson(github.event.workflow_run) }}"
      - uses: actions/github-script@v7
        with:
          script: console.log(context.payload.workflow_run);
