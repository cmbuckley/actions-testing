name: Manual Dispatch
on:
  workflow_dispatch:
    inputs:
      home:
        description: Home page
        type: boolean
        default: true
      showcase:
        description: Showcase pages
        type: boolean
        default: true
      portfolio:
        description: Portfolio pages
        type: boolean
        default: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Testy test
        env:
          BUILD_HOME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.home || 'true' }}
          BUILD_SHOWCASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.showcase || 'true'}}
          BUILD_PORTFOLIO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.portfolio || 'true' }}
        run: |
          echo '${{ toJSON(github.event.inputs) }}'
          echo '${{ toJSON(inputs) }}'
